name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@e462100046f5e62dd4c8e901960867f56bf6e1a1 # v1.2.6
    with:
      spoon_name: ProcessWatcher
      tag: ${{ inputs.tag }}
