name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string
      bump:
        description: Force the bump level (auto = derive from commits)
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      docs_only:
        description: Regenerate and redeploy the Pages docs only (no bump, no release)
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@526f112bfc511e4429d394619e7243465c30c8ba # v1.5.0
    with:
      spoon_name: ProcessWatcher
      tag: ${{ inputs.tag }}
      bump: ${{ inputs.bump }}
      docs_only: ${{ inputs.docs_only == true }}
