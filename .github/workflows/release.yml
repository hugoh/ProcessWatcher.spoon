name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@9b0196dd06b709ae53174c5075a06c7b948c5810 # v1.2.3
    with:
      spoon_name: ProcessWatcher
      tag: ${{ inputs.tag }}
