name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string
      bump:
        description: Force the bump level (auto = derive from commits)
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@30f991da42d2a1fd29fcc38d83c9831b95f6dc50 # v1.3.3
    with:
      spoon_name: ProcessWatcher
      tag: ${{ inputs.tag }}
      bump: ${{ inputs.bump }}
