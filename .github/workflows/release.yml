name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@713fb1bcd3bec558aaf1932183d435292e16e0ba # v1.3.1
    with:
      spoon_name: ProcessWatcher
      tag: ${{ inputs.tag }}
