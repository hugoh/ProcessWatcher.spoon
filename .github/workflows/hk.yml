name: hk

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@22fda8a15b673e6acc9c89422bd4c38adec3cb14 # v1.40.18
    permissions:
      contents: read
      packages: read
      statuses: write
