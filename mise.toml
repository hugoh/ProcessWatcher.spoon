[tools]
actionlint = "1.7.12"
pinact = "5.0.0"
biome = "2.5.4"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hk = "2.5.0"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.14.1"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
rumdl = "0.2.78"
stylua = "2.5.2"
tombi = "1.7.1"
typos = "1.50.3"
uv = "0.12.23"
"github:owenlamont/ryl" = "0.23.0"
zizmor = "1.30.1"

[env]
HS_MOCK_VERSION = "1.6.1"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.package]
depends = ["docs"]
run = """
rm -rf dist
mkdir -p dist/ProcessWatcher.spoon
cp init.lua LICENSE README.md docs/docs.json dist/ProcessWatcher.spoon/
cp -r bin dist/ProcessWatcher.spoon/
cd dist
zip -r ../ProcessWatcher.spoon.zip ProcessWatcher.spoon
cd ..
rm -rf dist
"""
description = "Build a self-contained ProcessWatcher.spoon.zip (includes docs.json)"

[tasks.deps]
description = "Install the pinned hs_mock into the project-local .rocks tree"
run = "luarocks install --tree .rocks https://github.com/hugoh/spoon-tools/releases/download/v$HS_MOCK_VERSION/hs-mock-$HS_MOCK_VERSION-1.rockspec"
sources = ["mise.toml"]
outputs = [".rocks/lib/luarocks/rocks-5.4/hs-mock/*/rock_manifest"]

[tasks.test]
depends = ["deps"]
run = "busted test_spec.lua --verbose"

[hooks]
postinstall = ["luarocks install busted"]
